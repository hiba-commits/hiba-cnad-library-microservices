services:

  # ─── Book Service ─────────────────────────────
  book-service:
    build:
      context: ./book-service
    container_name: book-service
    networks:
      - backend-net
    environment:
      - PORT=3001
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ─── Member Service ───────────────────────────
  member-service:
    build:
      context: ./member-service
    container_name: member-service
    networks:
      - backend-net
    environment:
      - PORT=3003
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3003/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ─── Loan Service ─────────────────────────────
  loan-service:
    build:
      context: ./loan-service
    container_name: loan-service
    networks:
      - backend-net
    environment:
      - PORT=3002
      - NODE_ENV=production
      - BOOK_SERVICE_URL=http://book-service:3001
      - MEMBER_SERVICE_URL=http://member-service:3003
    depends_on:
      book-service:
        condition: service_healthy
      member-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ─── API Gateway ──────────────────────────────
  api-gateway:
    image: nginx:alpine
    container_name: api-gateway
    networks:
      - backend-net
    volumes:
      - ./api-gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:8080"
    depends_on:
      - book-service
      - member-service
      - loan-service
    restart: unless-stopped

networks:
  backend-net:
    driver: bridge